[project]
name = "entirius-django-getresponse"
version = "2.1.0"
description = "GetResponse marketing integration for Volkanos: accounts, campaigns, contact/category/product sync"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "celery",
    # app-level coupling: receivers connect post_save to django_checkout.Order/Cart
    # (lazy string sender registered unconditionally in apps.ready — signals.E001 without it)
    "entirius-django-checkout>=9.0.0",
    # mutual dependency: django_crm's compat layer imports this app's models,
    # this app FKs django_crm.form and imports it in utils — both declare each other
    "entirius-django-crm>=3.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-pricemanager>=4.0.1",
    "entirius-py-get-response-sdk>=3.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-getresponse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_getresponse"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S108"]
# Legacy migrated 1:1 (F821 = unquoted type annotations resolved only at runtime call sites)
"src/django_getresponse/models/*.py" = ["DJ001", "DJ008"]
"src/django_getresponse/admin/*.py" = ["S308"]
"src/django_getresponse/admin/__init__.py" = ["F401", "F403"]
"src/django_getresponse/receivers/*.py" = ["F821"]
"src/django_getresponse/services/*.py" = ["F821"]
"src/django_getresponse/utils/*.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["django_getresponse"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# entirius-django-checkout: app-level coupling only — receivers connect post_save to
# django_checkout.Order/Cart via lazy string senders, no Python import anywhere.
DEP002 = ["entirius-django-checkout"]
